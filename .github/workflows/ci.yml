name: CI
# swift_sql's CI, as Reviews' policy for Logan's protected repositories has
# it (AttilaTheFun/reviews, docs/CI_POLICY.md; Logan, 7 Nov 2026):
#
# Automated CI only builds: no test runs on its own (Logan, 7 Nov 2026).
#
# - A pull request runs one job, `container`, the required check: in one of
#   Shireworks' single-use Linux containers (swift_sql-jit), leasing
#   nothing, the package and its tests built on Linux with SwiftPM (the
#   vendored amalgamation), and the tests built as a macOS bundle with
#   Bazel, which reads Shireworks' cache and never writes it. A pull request of documentation
#   alone stops there. A newer push cancels its run. A fork's pull request
#   runs nothing here: no self-hosted runner ever runs a fork's code.
# - Each commit on main runs `populate`: the bundle built, cache-only, the
#   one job that writes the cache.
# - Every test runs only by hand (workflow_dispatch on main, `run`):
#   - `verify`: the tests on GitHub's own runners: on Apple's platforms (a
#     Mac), on Windows (Swift 6.3.2), and on Linux in Swift 6.2's own image,
#     the oldest Swift it supports. Its last job,
#     `verify`, keeps the `proof` artifact (no screens: each platform's
#     result and log), and its success is the commit's tests passing. Run
#     on a branch pushed at an earlier commit, it bisects a regression;
#   - `release`, with `version`: verify first; only once it passes, a draft
#     release v<version> on the commit, naming the run (propose). A library
#     has no Alphas and no pre-releases.
# - Logan's Release in Reviews publishes the draft, which makes its tag:
#   `release` checks the commit is on main and was verified. Consumers pin
#   the tag's version.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      run:
        description: "verify: the tests on every platform. release: verify, then a draft release of version."
        type: choice
        options: [verify, release]
        default: verify
      version:
        description: "release: the version proposed, MAJOR.MINOR.PATCH"
        type: string
        required: false
  # Logan's Release in Reviews publishes the draft, which makes its v* tag.
  release:
    types: [published]
concurrency:
  # A pull request's newer push cancels its older run. Every other run is a
  # group of its own and never cancelled.
  group: >-
    ${{ github.event_name == 'pull_request'
        && format('ci-pr-{0}', github.head_ref)
        || format('ci-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  actions: read
# Whom the jobs' Shireworks leases are for: each lease is `<job>-<run>@ci`
# (OSS_CLIENT_ID until Shireworks 0.4).
env:
  SHIREWORKS_CLIENT_ID: ${{ github.job }}-${{ github.run_id }}
  OSS_CLIENT_ID: ${{ github.job }}-${{ github.run_id }}
# Every step in bash with pipefail (GitHub's `bash --noprofile --norc -eo
# pipefail {0}`): its default, `bash -e {0}`, takes a pipe's last status, so
# a failing command piped into tee or grep would pass.
defaults:
  run:
    shell: bash
jobs:
  # ---- Pull requests -------------------------------------------------------

  container:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, swift_sql-jit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      # Whether it changes anything but documentation (docs/, .notes/,
      # Markdown).
      - id: changes
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          if printf '%s\n' "$files" | awk '!/^([Dd]ocs\/|\.notes\/)|\.md$/ { code = 1 } END { exit !code }'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
      # Linux: the package and its tests built (the vendored amalgamation),
      # with the runner's Swift. They run in verify.
      - name: Built on Linux
        if: steps.changes.outputs.code == 'true'
        run: |
          swift --version
          swift build --build-tests
      # The cache is read here, never written: populate alone writes it.
      - name: The cache, read only
        if: steps.changes.outputs.code == 'true'
        run: echo 'build --noremote_upload_local_results' >> ~/.bazelrc
      # Apple's platforms: the tests built as a macOS bundle, in this
      # container (tools/ci/mac_vm_tests.sh), which only verify runs.
      - name: The tests built for the Mac
        if: steps.changes.outputs.code == 'true'
        run: tools/ci/mac_vm_tests.sh --build-here --build-only

  # ---- main ----------------------------------------------------------------

  # The cache's one writer (Shireworks' `ci.populate` grants this job the
  # write): the bundle built as a pull request's container job builds it.
  # No tests, nothing published.
  populate:
    if: github.event_name == 'push'
    runs-on: [self-hosted, swift_sql-jit]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: tools/ci/mac_vm_tests.sh --build-here --build-only

  # ---- By hand: verify -----------------------------------------------------

  # Each platform's tests, on GitHub's own runners (the repository is
  # public), so none waits on Shireworks' Macs: Logan, 8 Nov 2026. Each keeps
  # its log and how it ended as its part of the proof, whether it passed or
  # not.
  #
  # Apple's: the system's SQLite, `swift test` on one of GitHub's Macs.
  tests-macos:
    if: github.event_name == 'workflow_dispatch'
    runs-on: xcode-27
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The tests
        run: |
          mkdir -p "$RUNNER_TEMP/part"
          status=0
          swift test > >(tee "$RUNNER_TEMP/part/macos.log") 2>&1 || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/part/macos.status"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-macos
          path: ${{ runner.temp }}/part
          retention-days: 7

  # Windows: the vendored amalgamation, and the lock as a critical section,
  # with Swift 6.3.2 (the release the Windows VM had) on GitHub's Windows.
  tests-windows:
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      # compnerd/gha-setup-swift v0.5.1, by its commit.
      - uses: compnerd/gha-setup-swift@9ff1ee4c44888c5817fc14d1b257ac8cabb4935f
        with:
          swift-version: swift-6.3.2-release
          swift-build: 6.3.2-RELEASE
      - name: The tests
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "$env:RUNNER_TEMP/part" | Out-Null
          swift test 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/part/windows.log"
          $status = $LASTEXITCODE
          Set-Content -Path "$env:RUNNER_TEMP/part/windows.status" -Value "$status"
          exit $status
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-windows
          path: ${{ runner.temp }}/part
          retention-days: 7

  # Linux: the vendored amalgamation, in Swift 6.2's own image, the oldest
  # Swift it supports.
  tests-linux:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    container: docker.io/library/swift:6.2-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: The tests
        run: |
          mkdir -p "$RUNNER_TEMP/part"
          status=0
          swift test > >(tee "$RUNNER_TEMP/part/linux.log") 2>&1 || status=$?
          printf '%s\n' "$status" > "$RUNNER_TEMP/part/linux.status"
          exit "$status"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: part-linux
          path: ${{ runner.temp }}/part
          retention-days: 7

  # The proof: no screens, each platform's result, its test and failure
  # counts and its log (proof.json, in the shape Reviews' tab reads: a
  # library's proof, `kind: tests`; logs/), kept as the `proof` artifact Reviews
  # reads. It passes only when every platform's tests did: its success is
  # the commit verified, which propose and the release job ask for.
  verify:
    needs: [tests-macos, tests-windows, tests-linux]
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: ${{ runner.temp }}/parts
      - name: The proof
        env:
          COMMIT: ${{ github.sha }}
          REF: ${{ github.ref }}
          RUN: ${{ github.run_id }}
        run: |
          mkdir -p "$RUNNER_TEMP/proof/logs"
          python3 -I - "$RUNNER_TEMP/parts" "$RUNNER_TEMP/proof" << 'PY'
          import json, os, re, shutil, sys
          parts, proof = sys.argv[1], sys.argv[2]
          platforms = []
          for platform, name in (("macos", "macOS"), ("windows", "Windows"), ("linux", "Linux (Swift 6.2)")):
              folder = os.path.join(parts, "part-" + platform)
              log = os.path.join(folder, platform + ".log")
              status = os.path.join(folder, platform + ".status")
              entry = {"name": name}
              if not os.path.exists(status):
                  # The platform never reported: not passed.
                  entry.update(result="failed", tests=0, failures=0)
                  platforms.append(entry)
                  continue
              code = int(open(status).read().strip() or "1")
              text = open(log, errors="replace").read() if os.path.exists(log) else ""
              # XCTest's "Executed 42 tests, with 1 failure", or Swift
              # Testing's "Test run with 42 tests failed after … with 1 issue".
              executed = re.findall(r"Executed (\d+) tests?, with (\d+) failures?", text)
              testing = re.findall(r"Test run with (\d+) tests? (?:passed|failed)[^\n]*?(?:with (\d+) issues?)?", text)
              if executed:
                  tests, failures = int(executed[-1][0]), int(executed[-1][1])
              elif testing:
                  tests, failures = int(testing[-1][0]), int(testing[-1][1] or 0)
              else:
                  tests, failures = 0, 0
              entry.update(result="passed" if code == 0 else "failed", tests=tests, failures=failures)
              if os.path.exists(log):
                  shutil.copy(log, os.path.join(proof, "logs", platform + ".log"))
                  entry["log"] = "logs/" + platform + ".log"
              platforms.append(entry)
          json.dump({"commit": os.environ["COMMIT"], "ref": os.environ["REF"],
                     "run": int(os.environ["RUN"]), "kind": "tests", "platforms": platforms},
                    open(os.path.join(proof, "proof.json"), "w"), indent=2)
          print(json.dumps(platforms, indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: proof
          path: ${{ runner.temp }}/proof
          retention-days: 90
      - if: needs.tests-macos.result != 'success' || needs.tests-windows.result != 'success' || needs.tests-linux.result != 'success'
        run: |
          echo "::error::Not verified: macOS $MACOS, Windows $WINDOWS, Linux $LINUX (each platform's in proof.json)"
          exit 1
        env:
          MACOS: ${{ needs.tests-macos.result }}
          WINDOWS: ${{ needs.tests-windows.result }}
          LINUX: ${{ needs.tests-linux.result }}

  # ---- By hand: a release proposed -----------------------------------------

  # The draft release, once verify passed (tools/ci/propose_release.sh).
  propose:
    needs: verify
    if: >-
      always() && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
      inputs.run == 'release' && needs.verify.result == 'success'
    runs-on: [self-hosted, swift_sql-jit-small]
    timeout-minutes: 5
    permissions:
      # The draft release.
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      # Untrusted text reaches the shell through env, never ${{ }} in run.
      - env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version }}
        run: tools/ci/propose_release.sh "$VERSION"

  # ---- Released ------------------------------------------------------------

  # Logan's Release in Reviews: the tag's commit must be on main and
  # verified (tools/ci/verified_run.sh: a run by hand whose verify passed
  # and kept its proof). Nothing is built or published.
  release:
    if: github.event_name == 'release' && !github.event.release.prerelease && startsWith(github.ref, 'refs/tags/v')
    runs-on: [self-hosted, swift_sql-jit-small]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: The release is a main commit
        run: git merge-base --is-ancestor HEAD origin/main || { echo "::error::$GITHUB_REF_NAME's commit is not on main"; exit 1; }
      - name: The release was verified
        env:
          GH_TOKEN: ${{ github.token }}
        # An assignment, so that the script's failure fails the step (an
        # echo of its output would pass whatever it said).
        run: |
          run="$(tools/ci/verified_run.sh "$(git rev-parse HEAD)")" \
            || { echo "::error::$GITHUB_REF_NAME's commit was not verified: no release"; exit 1; }
          echo "Verified by run $run"
