name: CI
on:
  pull_request:
  push:
    branches: [main]
# A newer push to a pull request cancels its run if it hasn't finished;
# main's runs are never cut short.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
# On the repository's own runner (self-hosted, swift_sql-ci), which leases
# what a job runs in from OS Server and which a fork's pull request never
# reaches.
jobs:
  # Whether the pull request changes anything but documentation (Markdown,
  # docs/, .notes/); a push to main always does. A job it skips passes.
  changes:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, swift_sql-ci]
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - id: diff
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -z "$BASE" ]; then echo "code=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          files="$(git diff --name-only "$BASE" HEAD)"
          echo "$files"
          if printf '%s\n' "$files" | awk '!/^([Dd]ocs\/|\.notes\/)|\.md$/ { code = 1 } END { exit !code }'; then code=true; else code=false; fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

  # Apple's platforms: the system's SQLite, in a macOS VM
  # (tools/ci/mac_vm_tests.sh).
  macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, swift_sql-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # exec: the runner's cancel reaches the script's trap, which releases the VM.
      - run: exec tools/ci/mac_vm_tests.sh

  # Linux: the vendored amalgamation, built from cswiftsql.c, in a container
  # of Swift's image (tools/ci/linux_tests.sh).
  linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, swift_sql-ci]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - run: exec tools/ci/linux_tests.sh

  # Windows: the vendored amalgamation, and the lock as a critical section,
  # in a Windows VM (tools/ci/windows_vm_tests.sh).
  windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: [self-hosted, swift_sql-ci]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      # exec: the runner's cancel reaches the script's trap, which releases the VM.
      - run: exec tools/ci/windows_vm_tests.sh
