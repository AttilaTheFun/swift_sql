name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  # Apple's platforms: the system's SQLite.
  macos:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test (SwiftPM)
        run: swift test

  # Linux: the vendored amalgamation, built from cswiftsql.c.
  linux:
    runs-on: ubuntu-24.04
    container: swift:6.2-noble
    steps:
      - uses: actions/checkout@v4
      - name: Test (SwiftPM)
        run: swift test

  # Windows: the vendored amalgamation, and the lock as a critical section.
  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.2-release
          tag: 6.2-RELEASE
      - name: Test (SwiftPM)
        run: swift test
